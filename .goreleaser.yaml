# Release build. Linux only: the tool drives pacman, apt, dnf, flatpak and
# snap, none of which exist on the other platforms goreleaser would happily
# cross-compile for.
version: 2
project_name: system-patch

before:
  hooks:
    - go mod tidy

builds:
  - id: system-patch
    main: .
    binary: system-patch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    go install github.com/Sousf/system-patch@{{ .Tag }}
    ```

    Or on Arch: `paru -S system-patch`

# Written by MARSHAL onboarding. A formula rather than a cask, so it installs
# on Linux too. Pushed over SSH with a deploy key that can write to the tap
# and nothing else; `marshal tap-key system-patch` creates it.
brews:
  - name: system-patch
    repository:
      owner: Sousf
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:Sousf/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    directory: Formula
    homepage: https://github.com/Sousf/system-patch
    description: "A TUI tool that helps you determine whether to install a package update."
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    install: |
      bin.install "system-patch"
    test: |
      assert_match version.to_s, shell_output("#{bin}/system-patch version")
